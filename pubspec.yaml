name: hr360_go
description: HR360 Go — employee mobile app (attendance, self-service).
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.0
  geolocator: ^13.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  path_provider: ^2.1.5
  go_router: ^14.6.2
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  archive: ^4.0.9
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/ic_launcher.png
  adaptive_icon_background: assets/images/ic_launcher_background.png
  adaptive_icon_foreground: assets/images/ic_launcher_foreground.png
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/images/
    - .env
